services:
  # Runs once: downloads MobileNetV2, writes it into the shared volume, exits.
  model-init:
    build: ./model-init
    volumes:
      - model-store:/models
    networks:
      - app-network

  # Serves the model over a REST API.
  tf-serving:
    image: tensorflow/serving:2.17.0
    command:
      - "--model_name=mobilenet"
      - "--model_base_path=/models/mobilenet"
      - "--rest_api_port=8501"
    volumes:
      - model-store:/models
    ports:
      # 8601 on this machine because the frontend already uses 8501.
      - "8601:8501"
    depends_on:
      # Wait until the model has actually been exported.
      model-init:
        condition: service_completed_successfully
    networks:
      - app-network

  # Streamlit UI: uploads the image and asks tf-serving for a prediction.
  frontend:
    build: ./frontend
    environment:
      TF_SERVING_URL: http://tf-serving:8501
    volumes:
      # Read-only: the frontend only needs labels.json from here.
      - model-store:/models:ro
    ports:
      - "8501:8501"
    depends_on:
      - tf-serving
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  model-store:
